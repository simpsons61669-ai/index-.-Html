    <style>
        /* ============================================================
           DESIGN SYSTEM
           ============================================================ */
        :root {
            --bg-primary: #050816;
            --bg-secondary: #0a0e27;
            --bg-tertiary: #0f1435;
            --bg-card: rgba(15, 20, 50, 0.6);
            --bg-card-hover: rgba(20, 28, 65, 0.8);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.45);
            --fenix-orange: #FF6B00;
            --fenix-red: #FF3D00;
            --fenix-ember: #FF9500;
            --accent-cyan: #00d4ff;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --gradient-fenix: linear-gradient(135deg, #FF6B00, #FF3D00);
            --gradient-fenix-glow: linear-gradient(135deg, #FF6B00, #FF9500);
            --gradient-cool: linear-gradient(135deg, #00d4ff, #0066ff);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-light: rgba(255, 255, 255, 0.1);
            --shadow-fenix: 0 0 40px rgba(255, 107, 0, 0.15);
            --section-pad: clamp(60px, 10vw, 120px);
            --container: 1200px;
            --nav-h: 72px;
            --r-sm: 8px;
            --r-md: 12px;
            --r-lg: 16px;
            --r-xl: 24px;
            --r-full: 9999px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --t-fast: 0.2s;
            --t-normal: 0.4s;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 16px); }

        body {
            font-family: 'DM Sans', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-secondary);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body.menu-open { overflow: hidden; }
        h1, h2, h3, h4 { font-family: 'Inter', sans-serif; color: var(--text-primary); line-height: 1.2; font-weight: 700; }
        a { text-decoration: none; color: inherit; }
        img { max-width: 100%; display: block; }
        button { cursor: pointer; border: none; outline: none; font-family: inherit; background: none; }
        ul { list-style: none; }
        ::selection { background: rgba(255, 107, 0, 0.3); color: #fff; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* Background */
        .noise-overlay {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .grid-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image: linear-gradient(rgba(255,107,0,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,107,0,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Layout */
        .container { max-width: var(--container); margin: 0 auto; padding: 0 24px; }
        .section { padding: var(--section-pad) 0; position: relative; z-index: 1; }

        .section-label {

            font-size: 13px; font-weight: 600; letter-spacing: 2px;

        .section-label::before { content: ''; width: 24px; height: 2px; background: var(--gradient-fenix); border-radius: 2px; }
        .section-title { font-size: clamp(28px, 5vw, 48px); font-weight: 800; margin-bottom: 16px; letter-spacing: -0.02em; }
        .section-subtitle { font-size: clamp(16px, 2vw, 18px); color: var(--text-secondary); max-width: 600px; }
        .section-header { text-align: center; margin-bottom: 60px; }

        /* Animations */
        .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }

        .reveal-d1 { transition-delay: 0.1s; }
        .reveal-d2 { transition-delay: 0.2s; }

        .reveal-d4 { transition-delay: 0.4s; }

        .btn-secondary {

        .btn-gold { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 700; }
        .btn-lg { padding: 18px 36px; font-size: 16px; }

        /* ============================================================
           NAVIGATION
           ============================================================ */

        .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 22px; z-index: 1002; }
        .nav-brand-icon {
            width: 38px; height: 38px; background: var(--gradient-fenix);
            border-radius: var(--r-sm); display: flex; align-items: center;

        .nav-links { display: flex; align-items: center; gap: 32px; }
        .nav-links a { font-size: 14px; font-weight: 500; color: var(--text-secondary); position: relative; padding: 4px 0; transition: color var(--t-fast); }
        .nav-links a:hover { color: var(--text-primary); }
        .nav-links a::after {

            background: var(--gradient-fenix); border-radius: 2px; transition: width var(--t-normal);
        }
        .nav-links a:hover::after { width: 100%; }

        .nav-cta-btn {
            padding: 10px 22px; background: var(--gradient-fenix); color: #fff;
            font-size: 13px; font-weight: 600; border-radius: var(--r-full); transition: all var(--t-normal);
        }
        .nav-cta-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(255,107,0,0.35); }

        .hamburger { display: none; flex-direction: column; gap: 5px; padding: 8px; z-index: 1002; }
        .hamburger span { width: 24px; height: 2px; background: var(--text-primary); border-radius: 2px; transition: all var(--t-normal); transform-origin: center; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

        .mobile-menu {
            position: fixed; inset: 0; background: rgba(5,8,22,0.98); backdrop-filter: blur(30px);
            z-index: 1001; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 28px; opacity: 0; visibility: hidden; transition: all var(--t-normal);
        }
        .mobile-menu.active { opacity: 1; visibility: visible; }
        .mobile-menu a { font-size: 26px; font-weight: 700; color: var(--text-secondary); }
        .mobile-menu a:hover { color: var(--fenix-orange); }

        /* ============================================================
           HERO
           ============================================================ */
        .hero {
            min-height: 100vh; display: flex; align-items: center;
            position: relative; padding-top: calc(var(--nav-h) + 20px); overflow: hidden;
        }

        .hero-orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; animation: orbFloat 12s ease-in-out infinite; }
        .hero-orb-1 { width: 500px; height: 500px; background: rgba(255,107,0,0.1); top: -15%; right: -10%; }
        .hero-orb-2 { width: 400px; height: 400px; background: rgba(255,61,0,0.08); bottom: -10%; left: -10%; animation-delay: -4s; }
        .hero-orb-3 { width: 300px; height: 300px; background: rgba(0,212,255,0.06); top: 40%; left: 50%; animation-delay: -8s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px,-20px) scale(1.05); }
            66% { transform: translate(-20px,20px) scale(0.95); }
        }

        .hero-content { text-align: center; max-width: 800px; margin: 0 auto; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: rgba(255,107,0,0.1);
            border: 1px solid rgba(255,107,0,0.2); border-radius: var(--r-full);
            font-size: 13px; font-weight: 600; color: var(--fenix-orange); margin-bottom: 24px;
        }
        .hero-badge-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .hero-title { font-size: clamp(36px, 7vw, 72px); font-weight: 900; letter-spacing: -0.03em; margin-bottom: 20px; line-height: 1.1; }
        .hero-title-gradient { background: var(--gradient-fenix-glow); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-subtitle { font-size: clamp(16px, 2.5vw, 20px); color: var(--text-secondary); max-width: 600px; margin: 0 auto 32px; }
        .hero-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }

        .hero-stats { display: flex; gap: 48px; justify-content: center; flex-wrap: wrap; }
        .hero-stat { text-align: center; }
        .hero-stat-number { font-size: 36px; font-weight: 900; color: var(--text-primary); }
        .hero-stat-number span { background: var(--gradient-fenix-glow); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-stat-label { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }

        /* ============================================================
           TRUST BAR

        .trust-bar {

            border-bottom: 1px solid var(--border-subtle); z-index: 1; position: relative;

        /* ============================================================

        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .service-card {

           ============================================================ */
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 24px; }
        .portfolio-card {

        .portfolio-image {
            height: 220px; background: var(--bg-tertiary);
            display: flex; align-items: center; justify-content: center;

        .portfolio-image::after {
            content: 'View →'; position: absolute; inset: 0;
            background: rgba(255,107,0,0.85); display: flex; align-items: center;

        }
        .portfolio-card:hover .portfolio-image::after { opacity: 1; }
        .portfolio-info { padding: 24px; }
        .portfolio-info h3 { font-size: 18px; margin-bottom: 8px; }
        .portfolio-info p { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
        .portfolio-tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .portfolio-tags span {

            border-radius: var(--r-full); font-size: 11px; color: var(--text-tertiary);
        }

        /* ============================================================
           ABOUT
           ============================================================ */
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        .about-image-wrapper {
            position: relative; width: 100%; aspect-ratio: 1;
            background: var(--bg-tertiary); border-radius: var(--r-xl);

        .about-highlight {

        .about-highlight-icon { color: var(--fenix-orange); font-size: 18px; }

        /* ============================================================
           PROCESS
           ============================================================ */
        .process-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
        .process-card {
